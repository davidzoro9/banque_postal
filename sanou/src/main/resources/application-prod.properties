spring.application.name=sirh_backend

# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:sigrh_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:sigrh_user}
spring.datasource.password=${DB_PASSWORD:sigrh_password_123}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=60000

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jackson.serialization.fail-on-empty-beans=false

# ===============================
# TOMCAT & MULTIPART
# ===============================
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.port=${PORT:8081}
server.address=0.0.0.0

# ===============================
# DISABLE H2 CONSOLE
# ===============================
spring.h2.console.enabled=false

