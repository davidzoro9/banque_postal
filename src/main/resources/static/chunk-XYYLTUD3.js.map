<div class="login-wrapper">

  <!-- Cercles décoratifs en arrière-plan -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>
  <div class="bg-orb orb-3"></div>

  <div class="login-card">

    <!-- Logo BPBF -->
    <div class="login-logo-container">
      <img src="bpbf-login-logo.png" alt="Banque Postale du Burkina Faso" class="login-brand-logo">
    </div>

    <!-- Titre -->
    <div class="card-header">
      <h1>Connexion</h1>
    </div>

    <!-- Formulaire -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">

      <div class="field-group">
        <label class="field-label">Matricule / Identifiant</label>
        <div class="input-wrapper">
          <input class="field-input"
                 type="email"
                 formControlName="email"
                 placeholder="ex: marie.dupont@sirh.bf"
                 autocomplete="username">
        </div>
      </div>

      <div class="field-group">
        <label class="field-label">Mot de passe</label>
        <div class="input-wrapper pw-wrapper">
          <input class="field-input"
                 [type]="hidePassword ? 'password' : 'text'"
                 formControlName="password"
                 placeholder="••••••••••••"
                 autocomplete="current-password">
          <button type="button" class="pw-toggle" (click)="hidePassword = !hidePassword"
                  [attr.aria-label]="hidePassword ? 'Afficher' : 'Masquer'">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </div>
      </div>

      @if (error) {
        <div class="error-msg">
          <mat-icon>error_outline</mat-icon>
          <span>{{ error }}</span>
        </div>
      }

      <button type="submit" class="submit-btn" [disabled]="loading || loginForm.invalid">
        @if (loading) {
          <span class="spin-icon"><mat-icon>sync</mat-icon></span>
        } @else {
          <mat-icon>lock</mat-icon>
        }
        <span>S'authentifier</span>
      </button>

    </form>

    <p class="card-footer">Accès réservé aux utilisateurs autorisés </p>

  </div>

</div>
