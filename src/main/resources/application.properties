spring.application.name=sirh_backend

# ===============================
# DATASOURCE (PostgreSQL)
# ===============================
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sigrh_db}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:1234}
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-timeout=60000

# ===============================
# JPA / HIBERNATE & DATA SEEDING
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.deserialization.fail-on-unknown-properties=false
app.seed.enabled=${APP_SEED_ENABLED:true}

# ===============================
# TOMCAT & MULTIPART MAX POST / PAYLOAD SIZE (50MB)
# ===============================
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

server.port=${PORT:8081}
server.address=0.0.0.0

# ===============================
# COMPRESSION HTTP (GZIP) & CACHE ASSETS
# ===============================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024
spring.web.resources.chain.cache=true
spring.web.resources.cache.cachecontrol.max-age=30d
spring.web.resources.cache.cachecontrol.cache-public=true

# ===============================
# DISABLE H2 CONSOLE
# ===============================
spring.h2.console.enabled=false

# ===============================
# SECURITY / JWT CONFIGURATION
# ===============================
app.jwt.secret=${JWT_SECRET:9a4f2c8d3e7b1a5f8c2e4d6a9b1c3e5f7a2b4c6d8e0f1a3b5c7d9e1f3a5b7c9d}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}