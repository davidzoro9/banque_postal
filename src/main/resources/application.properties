spring.application.name=sirh_backend

# ===============================
# DATASOURCE (H2 Embedded Persistent)
# ===============================
spring.datasource.url=jdbc:h2:file:./data/sigrh_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ===============================
# JPA / HIBERNATE & DATA INITIALIZATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===============================
# TOMCAT & MULTIPART MAX POST / PAYLOAD SIZE (50MB for Base64 files/PDFs)
# ===============================
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# H2 CONSOLE & PORT
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

server.port=${PORT:8081}
server.address=0.0.0.0