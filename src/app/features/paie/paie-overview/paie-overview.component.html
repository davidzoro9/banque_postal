<div class="module-overview">
  <div class="page-header"
       [style.background]="'linear-gradient(135deg, ' + module.gradientFrom + ', ' + module.gradientTo + ')'">
    <div class="ph-content">
      <div class="ph-icon"><mat-icon>{{ module.icon }}</mat-icon></div>
      <div>
        <h1>{{ module.name }}</h1>
        <p>{{ module.description }}</p>
      </div>
    </div>
  </div>

  <mat-card class="table-card">
    <mat-card-header>
      <mat-card-title>Derniers bulletins générés</mat-card-title>
      <button mat-button color="primary" (click)="navigate('/paie/bulletins/historique')" class="see-all-btn">
        Tout l'historique <mat-icon>arrow_forward</mat-icon>
      </button>
    </mat-card-header>
    <mat-card-content>
      <table class="data-table">
        <thead>
          <tr><th>Employé</th><th>Poste</th><th>Salaire net</th><th>Salaire brut</th><th>Mois</th><th>État</th></tr>
        </thead>
        <tbody>
          @for (b of recentBulletins; track b.employe) {
            <tr>
              <td><strong>{{ b.employe }}</strong></td>
              <td>{{ b.poste }}</td>
              <td class="amount">{{ b.net }}</td>
              <td class="amount muted">{{ b.brut }}</td>
              <td>{{ b.mois }}</td>
              <td><span class="etat-badge" [class.sent]="b.etat === 'Envoyé'">{{ b.etat }}</span></td>
            </tr>
          }
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>
</div>
