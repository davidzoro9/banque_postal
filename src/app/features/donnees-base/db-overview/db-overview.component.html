<div class="module-overview">
  <div class="page-header"
       [style.background]="'linear-gradient(135deg, ' + module.gradientFrom + ', ' + module.gradientTo + ')'">
    <div class="ph-content">
      <div class="ph-icon"><mat-icon>{{ module.icon }}</mat-icon></div>
      <div>
        <h1>{{ module.name }}</h1>
        <p>{{ module.description }}</p>
      </div>
    </div>
  </div>

  <div class="config-grid">
    @for (c of configuration; track c.section) {
      <mat-card class="config-card" (click)="navigate(c.route)" matRipple style="cursor: pointer;">
        <mat-card-content>
          <div class="cfg-icon" [style.background-color]="c.color + '1A'" [style.color]="c.color">
            <mat-icon>{{ c.icon }}</mat-icon>
          </div>
          <div class="cfg-info">
            <h3>{{ c.section }}</h3>
            <p>{{ c.desc }}</p>
          </div>
          <div class="cfg-count" [style.color]="c.color">{{ c.items }}</div>
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
