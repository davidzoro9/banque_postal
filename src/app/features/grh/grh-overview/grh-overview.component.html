<div class="module-overview">

  <div class="page-header"
       [style.background]="'linear-gradient(135deg, ' + module.gradientFrom + ', ' + module.gradientTo + ')'">
    <div class="ph-content">
      <div class="ph-icon"><mat-icon>{{ module.icon }}</mat-icon></div>
      <div>
        <h1>{{ module.name }}</h1>
        <p>{{ module.description }}</p>
      </div>
    </div>
  </div>

  <mat-card class="table-card">
    <mat-card-header>
      <mat-card-title>Dernières embauches</mat-card-title>
      <button mat-button color="primary" (click)="navigate('/grh/employes')" class="see-all-btn">
        Voir tous <mat-icon>arrow_forward</mat-icon>
      </button>
    </mat-card-header>
    <mat-card-content>
      <table class="data-table">
        <thead>
          <tr>
            <th>Collaborateur</th>
            <th>Poste</th>
            <th>Département</th>
            <th>Date d'embauche</th>
            <th>Contrat</th>
          </tr>
        </thead>
        <tbody>
          @for (emp of recentEmployees; track emp.nom) {
            <tr>
              <td>
                <div class="emp-cell">
                  <div class="emp-avatar" [style.background-color]="module.gradientFrom">
                    {{ emp.nom.charAt(0) }}
                  </div>
                  <span>{{ emp.nom }}</span>
                </div>
              </td>
              <td>{{ emp.poste }}</td>
              <td><span class="dept-chip">{{ emp.dept }}</span></td>
              <td>{{ emp.date }}</td>
              <td>
                <span class="contract-badge" [class.cdd]="emp.status === 'CDD'">
                  {{ emp.status }}
                </span>
              </td>
            </tr>
          }
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>

</div>
