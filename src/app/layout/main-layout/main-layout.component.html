<div class="app-shell">

  <!-- ① Toolbar fixe en haut -->
  <app-toolbar></app-toolbar>

  <!-- ② Barre de navigation des modules (sous la toolbar) -->
  <div class="module-navbar">
    <div class="module-tabs">
      @for (mod of moduleNav.modules; track mod.id) {
        <button class="module-tab"
                [class.active]="(moduleNav.activeModule$ | async)?.id === mod.id"
                [style.--tab-color]="mod.color"
                (click)="selectModule(mod)">
          <div class="tab-icon"
               [style.background]="(moduleNav.activeModule$ | async)?.id === mod.id
                 ? 'linear-gradient(135deg, ' + mod.gradientFrom + ', ' + mod.gradientTo + ')'
                 : ''">
            <mat-icon>{{ mod.icon }}</mat-icon>
          </div>
          <span class="tab-label">{{ mod.shortName }}</span>
        </button>
      }
    </div>

    <div class="navbar-right">
      <a class="nav-home-link" (click)="router.navigate(['/dashboard'])">
        <mat-icon>dashboard</mat-icon>
        <span>Accueil</span>
      </a>
    </div>
  </div>

  <!-- ③ Zone principale : Drawer gauche + Contenu -->
  <mat-sidenav-container class="sidenav-container" autosize>

    <!-- Drawer gauche : menu du module actif -->
    <mat-sidenav #leftSidenav mode="side" opened class="left-sidenav">
      <app-nav-drawer></app-nav-drawer>
    </mat-sidenav>

    <!-- Sidebar droite : raccourcis -->
    <mat-sidenav #rightSidenav position="end" mode="over" class="right-sidenav">
      <app-sidebar></app-sidebar>
    </mat-sidenav>

    <!-- Contenu principal -->
    <mat-sidenav-content class="main-content">
      <div class="page-wrapper">
        <router-outlet></router-outlet>
      </div>
    </mat-sidenav-content>

  </mat-sidenav-container>
</div>
